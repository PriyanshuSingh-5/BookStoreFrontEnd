<div style="width: 100%; height: 100%;">
    <mat-toolbar class="tool" fxLayout="row" fxLayoutAlign="space-between center">
      <div class="titleText" fxLayout="row" fxLayoutGap="2%">
        <img src="../../../assets/Book.png" />
        <a  matTooltip="user Dashboard" style="color: white;">BookStore</a>
        </div>

        </mat-toolbar>
        <div class="container" fxLayoutAlign="center center">
            <h4 style="text-align:center">Reset your Password</h4>
        <!-- <mat-card class="example-card"> -->
           <p style="text-align:center">Enter and confirm your new password</p>
              <!-- <mat-card-content>   -->
                    <mat-form-field appearance="outline">
                      <mat-label>Password</mat-label>
                      <input type="email" matInput placeholder="Password" value="" [(ngModel)]="email">
                      
                      <button mat-icon-button matSuffix (click)="hide = !hide"[attr.aria-label]="'Hide password'"[attr.aria-pressed]="hide">
                        <mat-icon style="color:black;" matSuffix>{{hide ? "visibility_off" : "visibility"}}</mat-icon>
                      </button>
                    </mat-form-field>
          
                    <mat-form-field appearance="outline">
                        <mat-label>Confirm Password</mat-label>
                        <input type="email" matInput placeholder="Password" value="" [(ngModel)]="email">
                        
                        <button mat-icon-button matSuffix (click)="hide = !hide"[attr.aria-label]="'Hide password'"[attr.aria-pressed]="hide">
                            <mat-icon style="color:black;" matSuffix>{{hide ? "visibility_off" : "visibility"}}</mat-icon>
                          </button>
                      </mat-form-field>
            
                    
                    
                    <button mat-button color="primary" (click)="reset()">Reset Password</button>
                 
            
              
        <!-- </mat-card>  -->
</div>
</div>
