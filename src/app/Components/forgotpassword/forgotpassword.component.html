<div style="width: 100%; height: 100%;">
    <mat-toolbar class="tool" fxLayout="row" fxLayoutAlign="space-between center">
      <div class="titleText" fxLayout="row" fxLayoutGap="2%">
        <img src="../../../assets/Book.png" />
        <a  matTooltip="user Dashboard" style="color: white;">BookStore</a>
        </div>

        </mat-toolbar>
        <div class="container" fxLayoutAlign="center center">
            <h4 style="text-align:center">Forgot your Password?</h4>
        <!-- <mat-card class="example-card"> -->
           <p style="text-align:center">Enter an email address and we will send a link to reset your password</p>
              <!-- <mat-card-content>   -->
                    <mat-form-field appearance="outline">
                      <mat-label>Email</mat-label>
                      <input type="email" matInput placeholder="Email" value="" [(ngModel)]="email">
                      <mat-icon matSuffix>email</mat-icon>
                    </mat-form-field>
          
                    
                    
                    <button mat-button color="primary" (click)="forgot()">Reset Password</button>
                 
            
              <!-- </mat-card-content>
        </mat-card> -->
</div>
</div>
